knowledge_engine:
  kb_name: ''
  kb_description: ''
  graph_patterns:
    tm-info:
      name: "tm-info"
      description: "Information TM. Used in ANSWER,ASK,POST,REACT."
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
      pattern:
        - ' ?tm_uri rdf:type saref:Service . '
        - ' ?tm_uri saref:hasOperation ?command_uri . '
        - ' ?command_uri  saref:observes ?market_uri . '
    tm-market-offer-info:
      name: "tm-market-offer-info"
      description: "Information about new offer. Used in ANSWER,ASK,POST,REACT."
      required_bindings:
        - "command_uri"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
      pattern:
        - ' ?market_uri rdf:type ?market_type .'
        - ' ?offer_uri rdf:type ubmarket:MarketTimeSeries .'
        - ' ?offer_uri ubmarket:hasMarketSequence ?sequence .'
        - ' ?offer_uri s4ener:producedBy ?market_uri .'
        - ' ?tm_uri saref:hasOperation ?command_uri .'
        - ' ?market_uri saref:isObservedBy ?command_uri .'
        - ' ?offer_uri s4ener:hasUpdateRate  ?update_rate.'
        - ' ?offer_uri s4ener:hasCreationTime ?time_create .'
        - ' ?offer_uri s4ener:hasEffectivePeriod  ?duration_uri .'
        - ' ?duration_uri  rdf:type  time:Interval; time:hasXSDDuration ?duration .'
    tm-market-offer:
      name: "tm-market-offer"
      description: ""
      required_bindings:
        - "offer_uri"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
      pattern:
        - ' ?offer_uri rdf:type ubmarket:MarketTimeSeries .'
        - ' ?offer_uri s4ener:producedBy ?market_uri . '
        - ' ?tm_uri saref:hasOperation ?command_uri .'
        - ' ?market_uri saref:isObservedBy ?command_uri .'
        - ' ?dp s4ener:belongsToTimeSeries ?offer_uri ; rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;'
        - '   s4ener:hasEffectivePeriod ?duration_uri ; saref:hasResult ?dpr.'
        - ' ?duration_uri  rdf:type  time:Interval; time:hasXSDDuration ?duration .'
        - ' ?dpr saref:hasValue ?value ; saref:isMeasuredIn "EURPerMWH" .'